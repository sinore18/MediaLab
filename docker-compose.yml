services:
  server-runtime:
    image: bleeper-server-runtime:latest
    build:
      context: ./server
      dockerfile: Dockerfile.runtime
    profiles:
      - runtime-build

  server:
    image: bleeper-server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - server-audio:/app/server/audio
      - server-logs:/app/server/logs
      - torch-cache:/home/app/.cache/torch
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        PROD: ${PROD:-false}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  server-audio:
  server-logs:
  torch-cache:
