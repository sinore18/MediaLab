[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "saptarshi dutta", email = "saptarshidutta599@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "azure-storage-blob>=12.31.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "openai-whisper>=20250625",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "torch>=2.11.0,<2.12.0",
    "torchaudio>=2.11.0,<2.12.0",
    "uroman>=1.3.1,<2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
server = "server:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
